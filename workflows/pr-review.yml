name: Private AI Pull Request Review (Hermes + Honcho + Local LLM)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  private-ai-pr-review:
    name: On-Premise Hermes + Honcho Code Review
    runs-on: [self-hosted, linux, x64, docker-gpu]
    timeout-minutes: 15
    steps:
      - name: Checkout PR Branch & Base Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Sanitized Unified Git Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD --unified=5 > /tmp/pr_diff.patch
          echo "diff_lines=$(wc -l < /tmp/pr_diff.patch)" >> "$GITHUB_OUTPUT"

      - name: Spin Up Local Inference & Honcho Memory Stack
        run: |
          docker compose -f docker/docker-compose.pr-reviewer.yml up -d --wait

      - name: Execute Hermes Review Agent Against Honcho Engineering Standards
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          HONCHO_WORKSPACE_ID: "halo-engineering-standards-v2"
          LOCAL_LLM_ENDPOINT: "http://localhost:11434/v1"
        run: |
          docker compose -f docker/docker-compose.pr-reviewer.yml exec -T hermes-agent \
            python3 -m hermes_reviewer.run \
              --diff-file /workspace/pr_diff.patch \
              --memory-namespace "$HONCHO_WORKSPACE_ID" \
              --output-markdown /workspace/review_comment.md

      - name: Post Automated Inline & Summary PR Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('/tmp/review_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewBody
            });
